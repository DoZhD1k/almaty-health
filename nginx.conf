user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Увеличиваем размер загружаемых файлов (для карт и данных)
    client_max_body_size 50M;

    # Настройки сжатия
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/geo+json;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Редирект на basePath приложения
        location = / {
            return 301 /hospital-admissions/;
        }

        # Статические ресурсы Next.js с префиксом basePath (/hospital-admissions)
        location ^~ /hospital-admissions/_next/static/ {
            alias /usr/share/nginx/html/hospital-admissions/_next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # GeoJSON файлы из geo-files (с basePath)
        location ~* ^/hospital-admissions/geo-files/.*\.geojson$ {
            alias /usr/share/nginx/html/hospital-admissions/geo-files/;
            expires 1d;
            add_header Cache-Control "public";
            add_header Content-Type "application/geo+json";
            try_files $uri =404;
        }

        # Настройки для статических файлов (с basePath)
        location ~* ^/hospital-admissions/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|mp3|json|txt|xml)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA роутинг для поддиректории /hospital-admissions
        location /hospital-admissions/ {
            alias /usr/share/nginx/html/hospital-admissions/;
            try_files $uri $uri/ /hospital-admissions/index.html;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-src 'self'; object-src 'none';" always;
        }

        # Отключаем логирование для favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        # Отключаем логирование для robots.txt
        location = /robots.txt {
            log_not_found off;
            access_log off;
        }
    }
}
