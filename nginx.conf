user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/geo+json;

    server {
        listen 80;
        server_name localhost;

        # Редирект с корня на приложение
        location = / {
            return 301 /hospital-admissions/;
        }

        # ОБЪЕДИНЕННАЯ СЕКЦИЯ (теперь она одна)
        location /hospital-admissions/ {
            proxy_pass http://hospital-app:3000; # hospital-app - это имя сервиса из docker-compose
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Настройки безопасности
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;
            add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; frame-src 'self'; object-src 'none';" always;
        }

        # Статические ресурсы (если они раздаются через Node.js, этот блок можно оставить как прокси)
        # Но так как у нас standalone режим, лучше просто проксировать всё через главный блок выше.
        # Если же вы копируете статику в образ Nginx, тогда нужны блоки ниже. 
        # Для простого запуска локально достаточно одного блока выше.

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }
    }
}