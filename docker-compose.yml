version: '3.8'

services:
  # Ваше приложение Next.js
  hospital-app:
    build:
      context: .
      args:
        - NEXT_PUBLIC_BASE_PATH=/hospital-admissions
        - CACHEBUST=1
    container_name: hospital_app_node
    ports:
      - "3000:3000"

  # Контейнер Nginx для проверки конфига
  nginx-proxy:
    image: nginx:alpine
    container_name: hospital_nginx_test
    ports:
      - "80:80" # Теперь заходим через http://localhost (без 3000)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hospital-app